# Os testes a cada push no main (e quando pedido na aba Actions): o teste de paridade (testes/paridade.sh) nos bancos, que
# confere também a documentação da API (o dicionário do cabeçalho e os campos explicados), a conferência do layout das telas e
# a dos textos fixos (nenhum texto na tela fora do dicionário: o sistema inteiro em chinês).
# Nos jobs dos bancos, depois da paridade, o teste da atualização (testes/migracao.sh): um banco instalado pela versão de
# antes do push, com dados, passa para a de agora pelas migrações, como no servidor de quem usa ao fazer o git pull.
# A simulação dos modos de rodízio (testes/simulacao.sh): cada modo vivido dia a dia, 28 dias, com o relógio da máquina
# adiantado de mentira (libfaketime) e o cron de manhã e de noite, conferido contra as regras do README.
# O resultado aparece na aba Actions do GitHub e no ✓ / ✗ ao lado de cada commit.
name: Testes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arquitetura:
    name: Arquitetura, idiomas e documentação (sem banco)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, mbstring, curl
          coverage: none
      - name: Arquitetura (as regras do código)
        run: php testes/arquitetura.php
      - name: Idiomas (os dicionários, os manuais e os READMEs traduzidos)
        run: php testes/textos.php
      - name: Documentação da API (o cabeçalho do api.php é o que a ajuda gera)
        run: php testes/dicionario.php
      - name: Cópias inválidas não substituem o banco e cópias antigas ainda voltam
        run: php testes/backup.php
      - name: Pesos extremos e previsão de carga
        run: php testes/motores.php

  paridade:
    name: Paridade (SQLite, PostgreSQL, MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: teste
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TESTE_MYSQL_USUARIO: root
      TESTE_MYSQL_SENHA: teste
      TESTE_PG_SENHA: teste
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # a versão de antes do push, para o teste da atualização
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, pgsql, sqlite3, curl, mbstring, fileinfo, dom, zlib, gd, zip
          coverage: none
      - name: Clientes dos bancos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client mariadb-client > /dev/null
      - name: Teste de paridade
        run: testes/paridade.sh sqlite pgsql mysql
      - name: Atualização de um banco antigo (a versão de antes do push, com dados, pelas migrações)
        run: testes/migracao.sh sqlite pgsql mysql
        env:
          MIGRACAO_BASE: ${{ github.event.before }}

  firebird:
    name: Paridade (SQLite e Firebird)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      firebird:
        image: firebirdsql/firebird:3
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports: ["3050:3050"]
    env:
      TESTE_FB_ARQUIVO: /var/lib/firebird/data/relogios_teste.fdb
      TESTE_FB_SENHA: masterkey
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # a versão de antes do push, para o teste da atualização
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, pdo_firebird, curl, mbstring, fileinfo, dom, zlib, gd, zip
          coverage: none
      - name: Cliente do Firebird
        run: sudo apt-get update -qq && sudo apt-get install -y -qq firebird3.0-utils > /dev/null
      - name: Teste de paridade
        run: testes/paridade.sh sqlite firebird
      - name: Atualização de um banco antigo (a versão de antes do push, com dados, pelas migrações)
        run: testes/migracao.sh firebird
        env:
          MIGRACAO_BASE: ${{ github.event.before }}

  simulacao:
    name: Simulação dos modos de rodízio (dia a dia, com o relógio adiantado)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, curl, mbstring, fileinfo, dom, zlib, gd, zip
          coverage: none
      - name: O libfaketime (o relógio falso do servidor, do cron e do roteiro)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq faketime > /dev/null
      - name: Os 19 modos (28 dias cada), as trocas de modo e a matriz do rodízio (todos os modos, trocas, ações e parâmetros)
        run: testes/simulacao.sh

  layout:
    name: Layout das telas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, curl, mbstring, fileinfo, dom, zlib, gd, zip
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Playwright e o Chromium
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
      - name: Interface da Configuração (celular, tablet e PC)
        run: node testes/configuracao-interface.cjs
      - name: Conferência do layout
        run: testes/paridade.sh --layout sqlite
      - name: Capturas das telas (para olhar quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout
          path: /tmp/relojoeiro-paridade.*/layout/
          if-no-files-found: ignore
          retention-days: 7
  rolagem:
    name: Rolagem das telas (computador, tablet de pé e deitado, celular)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, curl, mbstring, fileinfo, dom, zlib, gd, zip
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Playwright e o Chromium
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
      - name: Cada página até o fim, o menu aberto até o último item e a gaveta Explicações
        run: testes/paridade.sh --rolagem sqlite
  textos-fixos:
    name: Nenhum texto fixo (o sistema inteiro em chinês)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, curl, mbstring, fileinfo, dom, zlib, gd, zip
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Playwright e o Chromium
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
      # o roteiro inteiro em chinês e, depois, todas as telas: palavra em letra latina que não é dado nem vem do dicionário é
      # texto escrito direto no código (testes/texto-fixo.cjs); a regra 11 da arquitetura confere o mesmo no código das telas
      - name: Conferência dos textos fixos
        run: LINGUA=zh-CN testes/paridade.sh --textos sqlite
