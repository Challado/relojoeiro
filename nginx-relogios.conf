# Dentro do bloco server do nginx (ajuste /relogios/ se a pasta tiver outro nome). Abrem pelo navegador só as páginas e
# o api.php; os arquivos internos (o núcleo, o banco, a configuração, o cron, os scripts, os testes) e os de dados ficam
# bloqueados. O arquivo do SQLite fica fora da pasta publicada (DB_ARQUIVO); se ficar dentro, ele também é bloqueado aqui.
location ^~ /relogios/ {
    location ~* \.(json|sql|conf|md|sqlite|sqlite-wal|sqlite-shm|db)$ {
        deny all;
    }
    location ^~ /relogios/testes/ {
        deny all;
    }
    location ~ ^/relogios/(lib|banco|config|config\.exemplo|operacoes|pagina|cron|importar|instalar|criar_usuario)\.php$ {
        deny all;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
