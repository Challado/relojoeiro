# Dentro do bloco server do nginx (ajuste /relojoeiro/ se a pasta tiver outro nome). Abrem pelo navegador só as páginas e
# o api.php; os arquivos internos (o núcleo, o banco, a configuração, o cron, os scripts, os testes), os de dados e o que
# começa com ponto (a pasta .git) ficam bloqueados. O arquivo do SQLite fica fora da pasta publicada (DB_ARQUIVO); se
# ficar dentro, ele também é bloqueado aqui. No Apache, quem faz isso é o .htaccess da pasta.
location ^~ /relojoeiro/ {
    # o que começa com ponto: a pasta .git (quem instalou com git clone tem ela aqui), .gitignore, .htaccess...
    location ~ /\. {
        deny all;
    }
    location ~* \.(json|sql|conf|md|sqlite|sqlite-wal|sqlite-shm|db|log|bak)$ {
        deny all;
    }
    location ^~ /relojoeiro/testes/ {
        deny all;
    }
    location ~ ^/relojoeiro/(lib|banco|config|config\.exemplo|operacoes|pagina|cron|importar|instalar|criar_usuario)\.php$ {
        deny all;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
