# Dentro do bloco server do nginx (ajuste /relogios/ se a pasta tiver outro nome). Abrem pelo navegador só as páginas e
# o api.php; os arquivos internos (o núcleo, a configuração, o cron, os scripts) e os de dados ficam bloqueados.
location ^~ /relogios/ {
    location ~* \.(json|sql|conf|md)$ {
        deny all;
    }
    location ~ ^/relogios/(lib|config|config\.exemplo|operacoes|pagina|cron|importar|criar_usuario)\.php$ {
        deny all;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
